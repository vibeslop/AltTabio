name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Verify Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --quiet

      - name: Build macOS app bundle
        run: scripts/mac/build-app.sh --universal

      - name: Verify macOS bundle
        run: |
          test -s target/mac/AltTabio.app/Contents/MacOS/AltTabio
          test -s target/mac/AltTabio.app/Contents/Resources/LICENSE
          test -s target/mac/AltTabio.app/Contents/Resources/THIRD_PARTY_LICENSES.md
          lipo target/mac/AltTabio.app/Contents/MacOS/AltTabio -verify_arch arm64
          lipo target/mac/AltTabio.app/Contents/MacOS/AltTabio -verify_arch x86_64
          codesign --verify --deep --strict target/mac/AltTabio.app

      - name: Check the install script
        run: sh -n docs/install.sh

  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Verify Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --quiet

      - name: Build Rust release executable
        run: cargo build --release --quiet

      - name: Verify Rust release artifact
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath target\release\AltTabio.exe
          if ($artifact.Length -le 0) {
            throw "Rust release artifact is empty."
          }
