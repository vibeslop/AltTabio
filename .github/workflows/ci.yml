name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Verify Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --quiet

      - name: Build macOS app bundle
        run: scripts/mac/build-app.sh

      - name: Verify macOS bundle
        run: |
          test -s target/mac/AltTabio.app/Contents/MacOS/AltTabio
          codesign --verify --deep target/mac/AltTabio.app

  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Verify Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust
        run: cargo clippy --quiet --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --quiet

      - name: Build Rust release executable
        run: cargo build --release --quiet

      - name: Verify Rust release artifact
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath target\release\AltTabio.exe
          if ($artifact.Length -le 0) {
            throw "Rust release artifact is empty."
          }
