name: Release

# Loaded from the default branch, independently of the tag's build program.
on:
  workflow_run:
    workflows: ["Release build"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      windows_digest: ${{ steps.source.outputs.windows_digest }}
      macos_digest: ${{ steps.source.outputs.macos_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download build metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir metadata
      - name: Bind source and artifact digests
        id: source
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/validate-release.py metadata/release.json
      - name: Require signer approval and a main-only environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" > branches.json
          python3 - <<'PY'
          import json
          environment = json.load(open('environment.json'))
          branches = json.load(open('branches.json'))['branch_policies']
          assert any(rule['type'] == 'required_reviewers' and rule.get('reviewers')
              for rule in environment['protection_rules']), 'Release needs an authorized reviewer'
          assert not environment['can_admins_bypass'], 'Release approval must not be bypassed'
          assert len(branches) == 1 and branches[0]['type'] == 'branch' and branches[0]['name'] == 'main', 'Release must admit only main'
          PY

  windows:
    needs: authorize
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the reviewed archive digest
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
          DIGEST: ${{ needs.authorize.outputs.windows_digest }}
        run: |
          $archive = "AltTabio-$env:VERSION-windows-x64.zip"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $env:DIGEST) {
            throw "The Windows archive differs from the authorized build."
          }
      - name: Attest the authorized Windows archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: AltTabio-${{ needs.authorize.outputs.version }}-windows-x64.zip
      - name: Create the draft and attach without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.authorize.outputs.tag }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --verify-tag --title "AltTabio $env:VERSION" --notes ""
            if ($LASTEXITCODE -ne 0) { throw "Could not create the draft release." }
          }
          gh release upload $env:TAG "AltTabio-$env:VERSION-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the Windows archive." }

  macos:
    needs: [authorize, windows]
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_CERTIFICATE: 617A82407E9767025EDE4A62A9B990ADEA21F53B
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the reviewed bundle before importing the key
        env:
          DIGEST: ${{ needs.authorize.outputs.macos_digest }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          test "$(shasum -a 256 macos-unsigned.zip | cut -d ' ' -f 1)" = "$DIGEST"
          ditto -x -k macos-unsigned.zip input
          app=input/AltTabio.app
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.vibeslop.AltTabio
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = AltTabio
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'
          if codesign -d --entitlements :- "$app" 2>/dev/null | grep -q 'com.apple.security.cs.'; then
            echo '::error::The release bundle requests a hardened runtime exception.'
            exit 1
          fi
      - name: Import the pinned release identity
        env:
          CERTIFICATE: ${{ secrets.MACOS_RELEASE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD"
          keychain=$RUNNER_TEMP/release.keychain-db
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security find-certificate -c 'AltTabio Release' -p "$keychain" > "$RUNNER_TEMP/release.pem"
          test "$(openssl x509 -in "$RUNNER_TEMP/release.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)" = "$RELEASE_CERTIFICATE"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/release.pem"
          rm "$RUNNER_TEMP/release.pem"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "$RELEASE_CERTIFICATE"
      - name: Sign and verify the fixed bundle
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          app=input/AltTabio.app
          codesign --force --sign "$RELEASE_CERTIFICATE" --keychain "$RUNNER_TEMP/release.keychain-db" --options runtime --identifier com.vibeslop.AltTabio "$app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'
          codesign -d --extract-certificates="$RUNNER_TEMP/signer" "$app" 2>/dev/null
          test "$(shasum -a 1 < "$RUNNER_TEMP/signer0" | awk '{print toupper($1)}')" = "$RELEASE_CERTIFICATE"
          ditto -c -k --keepParent "$app" "AltTabio-$VERSION-macos.zip"
      - name: Remove the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/release.pem"
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: AltTabio-${{ needs.authorize.outputs.version }}-macos.zip
      - name: Attach the signed archive without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.authorize.outputs.tag }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: gh release upload "$TAG" "AltTabio-$VERSION-macos.zip"
