name: Release macOS

# Builds the universal bundle for a version tag, signs it with the release certificate, and
# attaches AltTabio-<version>-macos.zip to that tag's release, where docs/install.sh finds it. A
# release that does not exist yet is created as a draft, for the Windows archive to join before it
# is published. Run it by hand on a tag to rebuild that tag's archive.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}

jobs:
  package:
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    # The environment holds the release certificate and admits only v* tags.
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Check that the tag names the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p;/^version = /q' Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml."
            exit 1
          fi

      - name: Import the release certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_RELEASE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::The release environment lacks the certificate; run scripts/mac/make-signing-cert.sh --release."
            exit 1
          fi
          # A keychain of its own, outside the search list, so nothing but this job's codesign
          # sees the key. Its password only has to last the job.
          keychain=$RUNNER_TEMP/release.keychain-db
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          echo "ALTTABIO_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/mac/package.sh

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "AltTabio ${GITHUB_REF_NAME#v}" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "target/mac/AltTabio-${GITHUB_REF_NAME#v}-macos.zip" --clobber

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
